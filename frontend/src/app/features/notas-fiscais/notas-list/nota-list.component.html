<div class="page-container">
  <div style="display:flex; align-items:center;">
    <h2 class="section-title">Notas Fiscais</h2>
    <span class="spacer"></span>
    <button mat-raised-button color="primary" routerLink="/notas-fiscais/nova">
      <mat-icon>add</mat-icon> Nova nota fiscal
    </button>
  </div>

  <table mat-table [dataSource]="(notas | async) ?? []" class="full-width mat-elevation-z2">
    <ng-container matColumnDef="numero">
      <th mat-header-cell *matHeaderCellDef>Número</th>
      <td mat-cell *matCellDef="let n">#{{ n.numero }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let n">
        <mat-chip [color]="n.status === 'Aberta' ? 'accent' : 'primary'" selected>{{ n.status }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="itens">
      <th mat-header-cell *matHeaderCellDef>Itens</th>
      <td mat-cell *matCellDef="let n">{{ n.itens.length }} produto(s)</td>
    </ng-container>

    <ng-container matColumnDef="criadaEm">
      <th mat-header-cell *matHeaderCellDef>Criada em</th>
      <td mat-cell *matCellDef="let n">{{ n.criadaEm | date:'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let n">
        <button mat-button color="primary" [routerLink]="['/notas-fiscais', n.id]">
          Abrir <mat-icon>arrow_forward</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>
</div>
