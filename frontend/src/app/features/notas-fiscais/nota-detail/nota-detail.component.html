<div class="page-container" *ngIf="nota as n">
  <a class="back-link" routerLink="/notas-fiscais">&larr; Voltar para a lista</a>

  <mat-card style="margin-top: 16px;">
    <mat-card-header>
      <mat-card-title>Nota Fiscal #{{ n.numero }}</mat-card-title>
      <mat-card-subtitle>
        Criada em {{ n.criadaEm | date:'dd/MM/yyyy HH:mm' }}
        @if (n.fechadaEm) { · Fechada em {{ n.fechadaEm | date:'dd/MM/yyyy HH:mm' }} }
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-chip-set>
        <mat-chip [color]="n.status === 'Aberta' ? 'accent' : 'primary'" selected>{{ n.status }}</mat-chip>
      </mat-chip-set>

      <table mat-table [dataSource]="n.itens" class="full-width" style="margin-top: 16px;">
        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Produto</th>
          <td mat-cell *matCellDef="let i">{{ i.descricaoProduto }}</td>
        </ng-container>

        <ng-container matColumnDef="quantidade">
          <th mat-header-cell *matHeaderCellDef>Quantidade</th>
          <td mat-cell *matCellDef="let i">{{ i.quantidade }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
      </table>
    </mat-card-content>

    <mat-card-actions class="screen-actions" style="display:flex; align-items:center; gap:16px;">
      <button mat-raised-button color="primary" (click)="imprimir()" [disabled]="n.status !== 'Aberta' || imprimindo">
        @if (imprimindo) {
          <mat-spinner diameter="20" style="display:inline-block; vertical-align:middle; margin-right:8px;"></mat-spinner>
          Processando...
        } @else {
          <span><mat-icon>print</mat-icon> Imprimir nota fiscal</span>
        }
      </button>

      <span class="spacer"></span>

      <mat-slide-toggle [checked]="simulandoFalha" (change)="alternarFalhaSimulada($event.checked)">

      </mat-slide-toggle>
    </mat-card-actions>
  </mat-card>
</div>
