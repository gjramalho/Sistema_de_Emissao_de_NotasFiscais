<div class="page-container">
  <h2 class="section-title">Cadastro de Produtos</h2>

  <app-produto-form (produtoCriado)="onProdutoCriado()"></app-produto-form>

  <mat-form-field appearance="outline" class="full-width" style="margin-top: 24px;">
    <mat-label>Buscar por código ou descrição</mat-label>
    <input matInput [formControl]="busca" placeholder="Digite para filtrar...">
  </mat-form-field>

  <table mat-table [dataSource]="(produtos | async) ?? []" class="full-width mat-elevation-z2">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let p">{{ p.codigo }}</td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let p">{{ p.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef>Saldo</th>
      <td mat-cell *matCellDef="let p">
        <mat-chip [color]="p.saldo === 0 ? 'warn' : (p.saldo <= 2 ? 'accent' : 'primary')" selected>
          {{ p.saldo }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button color="warn" (click)="remover(p.id, p.codigo)" title="Remover">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"
        [style.display]="!termoBusca || row.codigo.toLowerCase().includes(termoBusca) || row.descricao.toLowerCase().includes(termoBusca) ? '' : 'none'">
    </tr>
  </table>
</div>
